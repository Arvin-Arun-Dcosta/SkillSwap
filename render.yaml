# Render Blueprint: one Docker web service that serves the API, WebSockets and the client.
# The database is MongoDB Atlas; paste its connection string when Render asks for MONGODB_URI.
services:
  - type: web
    name: skillswap
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health/ready
    autoDeployTrigger: commit
    domains:
      - skillswap.arvin.life
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '5000'
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        value: https://skillswap.arvin.life
      - key: CLIENT_ORIGINS
        value: https://skillswap.arvin.life
      - key: TRUST_PROXY
        value: 'true'
      # Public demo: one-click demo members, and everything resets to fresh demo data daily.
      - key: DEMO_MODE
        value: 'true'
      - key: SEED_DEMO_DATA
        value: 'true'
      - key: DEMO_RESET_HOURS
        value: '24'
